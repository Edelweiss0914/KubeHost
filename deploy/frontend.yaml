apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubehost-frontend
  namespace: kubehost-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubehost-frontend
  template:
    metadata:
      labels:
        app: kubehost-frontend
    spec:
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      containers:
      - name: frontend
        image: localhost/kubehost-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: kubehost-frontend
  namespace: kubehost-system
spec:
  selector:
    app: kubehost-frontend
  ports:
  - port: 80
    targetPort: 80

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubehost
  namespace: kubehost-system
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: kubehost-backend
            port:
              number: 8000
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: kubehost-backend
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kubehost-frontend
            port:
              number: 80
